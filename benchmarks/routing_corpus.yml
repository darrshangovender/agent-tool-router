# 50 routing cases for the customer-support catalogue defined in examples/customer_support_bot.py.
# Each case is (query, expected_tool, expected_refusal). Exactly one of the two outcome fields is set:
#   expected_tool: <name>        →  router should ROUTE to this tool
#   expected_refusal: <reason>   →  router should REFUSE with this reason
#
# Mix: 32 positive routes spread across all 8 tools, 18 refusals across the four refusal reasons.

