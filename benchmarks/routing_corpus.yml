# Labelled routing cases for the customer-support catalogue defined in examples/customer_support_bot.py.
#
# SYNTHETIC: every query was written by hand for this repository. None comes from a real customer,
# employer or client. The labels are the author's judgement; the ambiguous and low_confidence ones
# are arguable, and the set is small.
#
# This file was written BEFORE the first benchmark run and has not been edited to move a number.
#
# Each case has exactly one of:
#   expected_tool: <name>        the router should ROUTE to this tool
#   expected_refusal: <reason>   the router should REFUSE, with this reason
# 80 routes (10 per tool) and 55 refusals: no_matching_tool 20, out_of_scope 15, ambiguous_match 12,
# low_confidence 8.

